spring.application.name=url-shortner

#DB properties
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shortlink_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:shortlink_user}
spring.datasource.password=${DB_PASSWORD:shortlink_pass}

#Redis cache properties
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#Expiry time
expiry_days=${EXPIRY_DAYS:5}